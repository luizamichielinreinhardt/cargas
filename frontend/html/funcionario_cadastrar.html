<main>
    <h1>Cadastrar funcionário</h1>
    <p class="intro">A senha deve ser criptografada no backend antes de ser armazenada.</p>
    
<form id="form_funcionario">
<label for="nome">Nome completo</label><input type="text" id="nome" required>
<label for="email">E-mail</label><input type="email" id="email" required>
<label for="senha">Senha</label><input type="password" id="senha" minlength="8" required>
<button type="submit">Cadastrar funcionário</button>
</form>

    <div id="resposta" class="resposta" aria-live="polite"></div>
