<main>
    <h1>Cadastrar motorista</h1>
    <p class="intro">Sistema de Gestão e Rastreamento de Encomendas</p>
    
<form id="form_motorista">
<label for="nome">Nome completo</label><input type="text" id="nome" required>
<label for="cnh">CNH</label><input type="text" id="cnh" required>
<label for="cpf">CPF</label><input type="text" id="cpf" maxlength="14" required>
<label for="telefone">Telefone</label><input type="tel" id="telefone" required>
<button type="submit">Cadastrar motorista</button>
</form>
<p class="intro">CNH e CPF devem ser criptografados no backend. A interface não exibe esses documentos nas tabelas.</p>

    <div id="resposta" class="resposta" aria-live="polite"></div>
</main>
<footer>Logística Express · Sistema interno de gestão e rastreamento</footer>
</body>
