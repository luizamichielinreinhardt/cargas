<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/carga_cadastrar.js" defer></script>
    <title>Cadastrar carga - Logística Express</title>
</head>
<body>
<header><nav>
    <a href="../index.html">Início</a>
    <a href="./login.html">Login</a>
    <a href="./funcionario_cadastrar.html">Funcionários</a>
    <a href="./motorista_listar.html">Motoristas</a>
    <a href="./carga_cadastrar.html">Cargas</a>
    <a href="./entrega_listar.html">Entregas</a>
    <span id="verificar_log"></span>
</nav></header>
<main>
    <h1>Cadastrar carga</h1>
    <p class="intro">Toda carga precisa estar vinculada a um motorista cadastrado.</p>
    
<form id="form_carga">
<label for="descricao">Descrição da carga</label><input type="text" id="descricao" required>
<label for="peso">Peso</label><input type="number" id="peso" min="0.01" step="0.01" required>
<label for="volume">Volume</label><input type="number" id="volume" min="0.01" step="0.01" required>
<label for="codigoRastreio">Código numérico de rastreio</label><input type="number" id="codigoRastreio" min="1" required>
<label for="idMotorista">Código do motorista relacionado</label><input type="number" id="idMotorista" min="1" required>
<button type="submit">Cadastrar carga</button>
</form>

    <div id="resposta" class="resposta" aria-live="polite"></div>
</main>
<footer>Logística Express · Sistema interno de gestão e rastreamento</footer>
</body>
</html>
