<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/entrega_atualizar.js" defer></script>
    <title>Atualizar entrega - Logística Express</title>
</head>
<body>
<header><nav>
    <a href="../index.html">Início</a>
    <a href="./login.html">Login</a>
    <a href="./funcionario_cadastrar.html">Funcionários</a>
    <a href="./motorista_listar.html">Motoristas</a>
    <a href="./carga_cadastrar.html">Cargas</a>
    <a href="./entrega_listar.html">Entregas</a>
    <span id="verificar_log"></span>
</nav></header>
<main>
    <h1>Atualizar entrega</h1>
    <p class="intro">Sistema de Gestão e Rastreamento de Encomendas</p>
    
<form id="form_atualizar">
<label for="id">Código da entrega</label><input type="number" id="id" min="1" required>
<label for="cidadeDestino">Cidade de destino</label><input type="text" id="cidadeDestino">
<label for="status">Status</label><select id="status"><option value="">Manter atual</option><option value="TRANSITO">TRANSITO</option><option value="ENTREGUE">ENTREGUE</option></select>
<label for="data">Data</label><input type="date" id="data">
<label for="hora">Hora</label><input type="time" id="hora">
<label for="idCarga">Código da carga</label><input type="number" id="idCarga" min="1">
<button type="submit">Atualizar entrega</button>
</form>

    <div id="resposta" class="resposta" aria-live="polite"></div>
</main>
<footer>Logística Express · Sistema interno de gestão e rastreamento</footer>
</body>
</html>
