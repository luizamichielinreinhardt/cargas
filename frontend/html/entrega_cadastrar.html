<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/entrega_cadastrar.js" defer></script>
    <title>Cadastrar entrega - Logística Express</title>
</head>
<body>
<header><nav>
    <a href="../index.html">Início</a>
    <a href="./login.html">Login</a>
    <a href="./funcionario_cadastrar.html">Funcionários</a>
    <a href="./motorista_listar.html">Motoristas</a>
    <a href="./carga_cadastrar.html">Cargas</a>
    <a href="./entrega_listar.html">Entregas</a>
    <span id="verificar_log"></span>
</nav></header>
<main>
    <h1>Cadastrar entrega</h1>
    <p class="intro">A entrega deve estar vinculada a uma carga já cadastrada.</p>
    
<form id="form_entrega">
<label for="cidadeDestino">Cidade de destino</label><input type="text" id="cidadeDestino" required>
<label for="status">Status atual</label><select id="status" required><option value="">Selecione</option><option value="TRANSITO">TRANSITO</option><option value="ENTREGUE">ENTREGUE</option></select>
<label for="data">Data</label><input type="date" id="data" required>
<label for="hora">Hora</label><input type="time" id="hora" required>
<label for="idCarga">Código da carga relacionada</label><input type="number" id="idCarga" min="1" required>
<button type="submit">Cadastrar entrega</button>
</form>

    <div id="resposta" class="resposta" aria-live="polite"></div>
</main>
<footer>Logística Express · Sistema interno de gestão e rastreamento</footer>
</body>
</html>
