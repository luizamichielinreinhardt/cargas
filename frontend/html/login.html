    <h1>Login no sistema</h1>
    <p class="intro">Entre com o e-mail e a senha do funcionário cadastrado.</p>
    
<form id="form_login">
<label for="email">E-mail do funcionário</label><input type="email" id="email" required>
<label for="senha">Senha</label><input type="password" id="senha" required>
<button type="submit">Entrar</button>
</form>
<p class="intro">A sessão deve expirar após 180 minutos. Esse prazo precisa ser configurado no backend.</p>

    <div id="resposta" class="resposta" aria-live="polite"></div>
